name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest ruff httpx

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build the serving image
        run: docker build -f api/Dockerfile -t mlops-mini/api:ci .

      - name: Build the Airflow image
        run: docker build -f airflow/Dockerfile -t mlops-mini/airflow:ci .

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose config --quiet
