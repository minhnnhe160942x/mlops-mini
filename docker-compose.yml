# Airflow 3 runs the API server, scheduler and DAG processor as separate
# services. LocalExecutor keeps it to those three - no Redis, no Celery worker.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: mlops-mini/airflow:3.3.2
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-mlops-mini-dev-secret}
    # The Task SDK signs its calls to the execution API with this shared secret.
    # Every Airflow service must agree on it or tasks die with "Invalid auth token".
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-mlops-mini-dev-jwt-secret}
    # Airflow 3 runs tasks through the Task SDK, which calls back into the API
    # server. The default points at localhost, which is nothing inside these
    # containers - tasks fail with "Connection refused" without this.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # Airflow 3 ships SimpleAuthManager by default: users are "name:role" and the
    # password lives in a generated file, which init seeds so the login is stable.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_manager_passwords.json
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    MODEL_NAME: ${MODEL_NAME:-breast-cancer-classifier}
    MODEL_ALIAS: ${MODEL_ALIAS:-champion}
    DRIFT_PSI_THRESHOLD: ${DRIFT_PSI_THRESHOLD:-0.2}
    PYTHONPATH: /opt/airflow/src
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.8.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000,localhost,127.0.0.1
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [ ! -f /opt/airflow/dags/training_pipeline.py ]; then
          echo "ERROR: /opt/airflow/dags is empty inside the container." >&2
          echo "The ./dags bind mount did not resolve. This happens when the repo" >&2
          echo "sits outside a path your Docker VM shares (common with Colima or" >&2
          echo "Lima). Move the repo under your home directory and try again." >&2
          exit 1
        fi
        airflow db migrate
        printf '{"%s": "%s"}' "${AIRFLOW_ADMIN_USER:-admin}" "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          > /opt/airflow/logs/simple_auth_manager_passwords.json
        echo "init done"
    restart: on-failure

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Airflow reports an unhealthy Triggerer on the home page if this is absent,
  # even when no deferrable operator is in use.
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: mlops-mini/api:0.1.0
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MODEL_NAME: ${MODEL_NAME:-breast-cancer-classifier}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      # Without these a cold registry makes startup hang on client retries.
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  mlflow-data:
  airflow-logs:
